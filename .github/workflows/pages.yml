name: Test and publish Ultrasuono Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check atlas and native DSP
        run: |
          node tests/check.mjs
          node tests/check-biomes.mjs
          node tests/check-visual-biomes.mjs
          node tests/check-tiles.mjs
          node tests/check-terraces.mjs
          node tests/check-recording.mjs
          node tests/check-audio-start.mjs
          node tests/check-motion.mjs
          g++ dsp/AudioProcessor.cpp tests/check-dsp.cpp dsp/vendor/Effects/*.cpp dsp/vendor/Filters/*.cpp -Idsp -Idsp/vendor -Idsp/vendor/Utility -std=c++17 -O2 -o /tmp/check-dsp
          /tmp/check-dsp
      - name: Install pinned Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.17
          /tmp/emsdk/emsdk activate 4.0.17
      - name: Build WebAssembly and check exports
        run: |
          source /tmp/emsdk/emsdk_env.sh
          bash scripts/build-dsp.sh
          node tests/check-wasm.mjs
          mkdir /tmp/site
          cp index.html /tmp/site/
          cp -r src assets dsp /tmp/site/
          mkdir /tmp/site/scripts
          cp scripts/build-dsp.sh /tmp/site/scripts/
          mkdir /tmp/site/atlas
          cp atlas/index.html /tmp/site/atlas/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
